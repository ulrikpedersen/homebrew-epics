name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bot:
    runs-on: macos-15
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # tap-syntax already uses --except=installed internally, so cellar checks are skipped here
      - run: brew test-bot --only-tap-syntax

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - name: Build, bottle, and verify changed formulae
        if: github.event_name == 'pull_request'
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}
          TAP_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          # Derive tap name from repo name (ulrikpedersen/homebrew-epics → ulrikpedersen/epics)
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          TAP_NAME="${OWNER}/${REPO_NAME#homebrew-}"
          ROOT_URL="https://ghcr.io/v2/ulrikpedersen/homebrew-epics"

          changed_files=$(git -C "${TAP_PATH}" diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'Formula/*.rb')
          if [ -z "${changed_files}" ]; then
            echo "No formula files changed, skipping build."
            exit 0
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            formula=$(basename "${f}" .rb)
            full_name="${TAP_NAME}/${formula}"
            echo "::group::${full_name}"

            # Install dependencies from pre-built bottles
            brew install --only-dependencies --formula "${full_name}"

            # Build from source in bottle mode
            brew install --build-bottle --verbose --formula "${full_name}"

            # Audit: --except=installed skips cellar checks (flat namespace, non-executables in bin/).
            # EPICS intentionally installs into bin/<arch>/ and lib/<arch>/ — this is by design.
            brew audit --formula --except=installed --git --skip-style "${full_name}"

            # Run formula test block
            brew test --verbose "${full_name}"

            # Linkage check
            brew linkage --test "${full_name}"

            # Package bottle and write JSON metadata
            brew bottle --json --verbose --root-url="${ROOT_URL}" "${full_name}"

            # Merge bottle sha256 back into the formula file
            brew bottle --merge --write --no-commit --no-all-checks ${formula}*.bottle.json

            echo "::endgroup::"
          done <<< "${changed_files}"

      - name: Check that bottles were produced
        if: github.event_name == 'pull_request'
        env:
          TAP_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          changed=$(git -C "${TAP_PATH}" diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'Formula/*.rb' | wc -l | tr -d ' ')
          bottles=$(find . -maxdepth 1 -name '*.bottle.*' | wc -l | tr -d ' ')
          echo "Formula files changed: $changed  Bottles produced: $bottles"
          if [ "$changed" -gt 0 ] && [ "$bottles" -eq 0 ]; then
            echo "ERROR: Formula files changed but no bottle files were produced!"
            exit 1
          fi

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: bottles_macos-15
          path: '*.bottle.*'
          if-no-files-found: warn
