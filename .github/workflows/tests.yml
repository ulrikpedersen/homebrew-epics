name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  tap-syntax:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Run brew test-bot --only-tap-syntax
        run: brew test-bot --only-tap-syntax

  build:
    needs: tap-syntax
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Run brew test-bot --only-formulae
        run: brew test-bot --only-formulae

      - name: Upload bottles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ matrix.runner }}
          path: "*.bottle.*"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-15
    concurrency:
      group: publish-main
      cancel-in-progress: false
    permissions:
      packages: write
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Download bottles
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish bottles to GHCR
        env:
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ulrikpedersen
        run: brew test-bot --only-formulae-upload

      - name: Commit updated sha256 hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git diff --cached --quiet || git commit -m "ci: update bottle sha256 [skip ci]"
          git push
