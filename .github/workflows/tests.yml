name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  tap-syntax:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Run brew test-bot --only-tap-syntax
        run: brew test-bot --only-tap-syntax

  build:
    needs: tap-syntax
    outputs:
      has_bottle_json: ${{ steps.bottle_json.outputs.found }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tap repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Detect changed formulae
        id: changed_formulae
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          head_sha="${{ github.sha }}"

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || true)"
          fi

          mapfile -t formulae < <(
            git diff --name-only "${base_sha}" "${head_sha}" -- "Formula/*.rb" \
              | sed -E 's#^Formula/(.*)\.rb$#\1#' \
              | sort -u
          )

          if (( ${#formulae[@]} == 0 )); then
            echo "formulae=" >> "${GITHUB_OUTPUT}"
            echo "No changed formulae found between ${base_sha} and ${head_sha}."
          else
            echo "formulae=${formulae[*]}" >> "${GITHUB_OUTPUT}"
            printf 'Changed formulae: %s\n' "${formulae[*]}"
          fi

      - name: Run brew test-bot --only-formulae --only-json-tab
        if: steps.changed_formulae.outputs.formulae != ''
        run: brew test-bot --only-formulae --only-json-tab ${{ steps.changed_formulae.outputs.formulae }}

      - name: Check for generated bottle JSON files
        id: bottle_json
        if: always()
        run: |
          if compgen -G "*.bottle.json" > /dev/null; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload bottles
        if: always() && steps.bottle_json.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ matrix.runner }}
          path: "*.bottle.*"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build.outputs.has_bottle_json == 'true'
    runs-on: macos-15
    concurrency:
      group: publish-main
      cancel-in-progress: false
    permissions:
      packages: write
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Download bottles
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish bottles to GHCR
        env:
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ulrikpedersen
        run: brew pr-upload --upload-only

      - name: Commit updated sha256 hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git diff --cached --quiet || git commit -m "ci: update bottle sha256 [skip ci]"
          git push
